name: research — drop into zone before event

# Исследование для решения «метка или запрет» (политика, открытые вопросы):
# как разрешаются рынки, упавшие в зону 50-65% за сутки до события.
# Нужен API Polymarket (Gamma + CLOB) — поэтому только Actions.
on:
  workflow_dispatch:
    inputs:
      max_markets:
        description: "Сколько закрытых рынков взять"
        default: "4000"
      min_volume:
        description: "Минимальный объём рынка, $"
        default: "20000"

permissions:
  contents: write          # сырые наблюдения коммитятся в research/ (артефакт недоступен из сессий разработки)

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Drop study
        run: python3 drop_study.py --max-markets "${{ inputs.max_markets }}" --min-volume "${{ inputs.min_volume }}"
      - uses: actions/upload-artifact@v4
        with:
          name: drop-study
          path: research/drop_study.json
      - name: Commit raw observations
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add research/drop_study.json
          git diff --staged --quiet || git commit -m "research: drop_study raw observations [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push attempt $i failed, retrying..."; sleep 5
          done
