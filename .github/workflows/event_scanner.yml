name: Event Scanner (v5)

on:
  schedule:
    - cron: '0 */12 * * *'   # каждые 12ч — ставки на год-полгода, за 6ч ничего
                             # не меняется; вдвое реже = вдвое меньше расход
  workflow_dispatch:

permissions:
  contents: write           # allow committing the journal back

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run event scan
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Event scan — $(date -u +'%Y-%m-%d %H:%M UTC')"
          python scan_events.py

      - name: Commit journal + seen state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add event_journal.jsonl event_seen.json calibration_journal.jsonl ai_cache.json grok_usage.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "event scan: update journal [skip ci]"
          # Race-safe push: a silent '|| echo' here once LOST the seen-state to
          # a non-fast-forward race and caused duplicate alerts. Rebase + retry.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push attempt $i failed, retrying..."; sleep 5
          done
