name: Polymarket Daily Status

# Дневной информационный статус: открытые позиции, нереал. P&L, подсказки
# фиксации/докупа (позиции небинарны — торгуются до резолва). Раз в день.
on:
  schedule:
    - cron: '0 6 * * *'   # ~09:00 MSK с учётом задержки Actions
  workflow_dispatch:

permissions:
  contents: write   # journal_resolver коммитит event_journal/resolutions/калибровку

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Resolve journal (event_journal -> resolutions.json -> калибровка)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python journal_resolver.py
      - name: Commit resolver state
        run: |
          git config user.name "Journal Resolver Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet event_journal.jsonl resolutions.json calibration_table.json 2>/dev/null; then
            echo "No resolver changes"
          else
            git add event_journal.jsonl resolutions.json calibration_table.json
            git commit -m "chore(resolver): journal resolutions + calibration [skip ci]"
            for i in 1 2 3; do
              git push && break
              echo "retry $i"; sleep 5; git pull --rebase origin main || true
            done
          fi
      - name: Daily status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLYMARKET_PROXY_WALLET: ${{ secrets.POLYMARKET_PROXY_WALLET }}
          POLYGON_RPC: ${{ secrets.POLYGON_RPC }}
        run: python daily_status.py
